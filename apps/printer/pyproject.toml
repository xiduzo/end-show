[project]
name = "end-show-printer"
version = "0.1.0"
description = "Local print service for the end-show: receives student content over HTTP and prints it on a NT-1809DD thermal printer"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-escpos[usb]>=3.1",
    "pillow>=10",
    "qrcode>=7",
    "httpx>=0.27",
]

[project.scripts]
end-show-printer = "printer.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printer"]
