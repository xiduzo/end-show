# Local asset cache for the end-show kiosk (Mac mini next to the printer).
#
# A reverse proxy in front of the R2 custom domain (show-assets.xiduzo.com) that
# caches every student asset to local disk under /tmp, so the big-screen Firefox
# serves 4K images/video off the LAN instead of the venue uplink — and survives
# browser cache-quota limits entirely.
#
# Started by start-show.sh, which launches Firefox with ?proxy=http://localhost:8080.
# /tmp is wiped on reboot, so the cache rebuilds itself each power-on (by design).
#
#   test:   nginx -c apps/printer/nginx-cache.conf -t
#   start:  nginx -c apps/printer/nginx-cache.conf
#   stop:   nginx -c apps/printer/nginx-cache.conf -s quit

worker_processes 1;
error_log /tmp/endshow-nginx-error.log warn;
pid /tmp/endshow-nginx.pid;

events { worker_connections 256; }

http {
  access_log off;

  # Resolve the upstream at REQUEST time, not config-load time. With a literal
  # hostname in proxy_pass, nginx does one gethostbyname at startup — and at
  # login/boot the network often isn't up yet, so that lookup fails with
  # "host not found in upstream" and nginx refuses to start (no cache, bare URL).
  # A resolver + a variable upstream (below) defers DNS until the first asset
  # request, by which point the LAN is up. ipv6=off avoids dead AAAA lookups.
  resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
  resolver_timeout 5s;

  # All scratch + cache lives in /tmp (wiped on reboot). 20g ceiling is far above
  # the worst case (~50 students * ~160MB ≈ 8GB); LRU-evicts past it. inactive=24h
  # drops anything not requested within a day — covers a multi-day show window.
  client_body_temp_path /tmp/endshow-nginx/client;
  proxy_temp_path       /tmp/endshow-nginx/proxy;
  proxy_cache_path /tmp/endshow-asset-cache levels=1:2 keys_zone=assets:16m
                   max_size=20g inactive=24h use_temp_path=off;

  server {
    listen 127.0.0.1:8080;
    server_name localhost;

    # App probes this once at load to decide proxy-vs-direct.
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      # Variable upstream forces per-request DNS via the resolver above, so the
      # config loads even when DNS is briefly unavailable at boot. With a variable
      # proxy_pass nginx no longer appends the URI automatically — pass it on
      # explicitly with $request_uri.
      set $asset_upstream show-assets.xiduzo.com;
      proxy_pass https://$asset_upstream$request_uri;
      proxy_set_header Host show-assets.xiduzo.com;
      proxy_ssl_server_name on;

      # Always fetch the FULL object from R2 (drop any client Range), so a single
      # complete file lands in cache; nginx then serves byte-range requests
      # (video seeking) straight from that cached file. The asset path carries the
      # per-upload UUID, so it's a stable key and a re-upload is a clean miss.
      proxy_set_header Range "";
      proxy_cache assets;
      proxy_cache_key "$uri";
      proxy_cache_valid 200 24h;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_502 http_503 http_504;

      # The kiosk page (https://show.xiduzo.com) loads these crossorigin, and this
      # origin (http://localhost) differs — so re-assert CORS ourselves rather than
      # depend on R2's headers surviving the proxy.
      proxy_hide_header Access-Control-Allow-Origin;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Accept-Ranges bytes always;
      add_header X-Cache "$upstream_cache_status" always;
    }
  }
}
